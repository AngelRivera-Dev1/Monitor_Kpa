<div class="wrap">
  <div>
    <h1>Monitor de vacío (kPa) por mantenimiento</h1>
    <p class="sub">Elige un ID_Maintenance para ver su historial de lecturas en el tiempo, o deja "Todos" para ver el panorama completo.</p>
  </div>

  <div class="panel filters">
    <div class="field">
      <label for="idInput">ID_Maintenance</label>
      <div class="row">
        <input id="idInput" list="ids" placeholder="Ej. Flex-PM6203" autocomplete="off">
        <datalist id="ids"></datalist>
        <button id="prev" title="ID anterior" aria-label="ID anterior">◀</button>
        <button id="next" title="ID siguiente" aria-label="ID siguiente">▶</button>
        <button id="all" aria-pressed="true">Todos</button>
      </div>
    </div>
    <div class="field">
      <span class="lbl">Tipo de gráfica</span>
      <div class="row" id="modes"><button data-m="bar" aria-pressed="true">Barras</button><button data-m="line">Líneas</button></div>
    </div>
    <div class="field">
      <span class="lbl">Periodo</span>
      <div class="row" id="ranges">
        <button data-d="30">30 días</button><button data-d="90">3 meses</button>
        <button data-d="180">6 meses</button><button data-d="365">1 año</button>
        <button data-d="0" aria-pressed="true">Todo</button>
      </div>
    </div>
    <div class="field"><label for="d1">Desde</label><input type="date" id="d1"></div>
    <div class="field"><label for="d2">Hasta</label><input type="date" id="d2"></div>
  </div>

  <div class="stats" id="stats"></div>

  <div class="panel">
    <div class="head">
      <h2 id="title"></h2>
      <div class="key" id="key"></div>
    </div>
    <div class="chartbox"><canvas id="c" role="img" aria-label="Gráfica de kPa contra fecha" style="display:block;touch-action:pan-y"></canvas><div id="tip" class="tip" hidden></div><div class="empty" id="empty" hidden>No hay lecturas en este periodo.</div></div>
  </div>

  <div class="panel">
    <details><summary>Ver tabla de lecturas</summary><div class="tw"><table><thead><tr><th>Fecha y hora</th><th>ID</th><th>kPa</th></tr></thead><tbody id="rows"></tbody></table></div></details>
  </div>

const pad=n=>String(n).padStart(2,'0');

// puntos: {x, y, id}
const ALL=[];
for(const id of ids)for(const [t,k] of RAW[id])ALL.push({x:off(t),y:k,id});
ALL.sort((a,b)=>a.x-b.x);

$('ids').innerHTML=ids.map(i=>`<option value="${i}">`).join('');

function cssv(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim()}

function filtered(){
  return ALL.filter(p=>(!S.id||p.id===S.id)&&p.x>=S.from&&p.x<S.to);
}
function weekly(pts){
  const m=new Map();
  for(const p of pts){const d=new Date(p.x);d.setHours(0,0,0,0);d.setDate(d.getDate()-d.getDay());const k=d.getTime();
    const o=m.get(k)||{s:0,n:0};o.s+=p.y;o.n++;m.set(k,o)}
  return [...m.entries()].sort((a,b)=>a[0]-b[0]).map(([x,o])=>({x:x+3.5*86400000,y:+(o.s/o.n).toFixed(2)}));

function render(){

}

      ctx.beginPath();ctx.moveTo(x,zero);ctx.lineTo(x,y-r);ctx.quadraticCurveTo(x,y,x+r,y);ctx.lineTo(x+pxw-r,y);ctx.quadraticCurveTo(x+pxw,y,x+pxw,y-r);ctx.lineTo(x+pxw,zero);ctx.closePath();ctx.fill()});
    ctx.strokeStyle=ink;ctx.lineWidth=1.5;ctx.beginPath();ctx.moveTo(PAD.l,Math.round(zero)+.5);ctx.lineTo(g.W-PAD.r,Math.round(zero)+.5);ctx.stroke();
  }else if(M.single){
    ctx.strokeStyle=pc;ctx.lineWidth=2;ctx.lineJoin='round';ctx.beginPath();
    M.pts.forEach((p,i)=>{const x=g.X(p.x),y=g.Y(p.y);i?ctx.lineTo(x,y):ctx.moveTo(x,y)});ctx.stroke();
    for(const p of M.pts){ctx.beginPath();ctx.arc(g.X(p.x),g.Y(p.y),4.5,0,7);ctx.fillStyle=pc;ctx.fill();ctx.lineWidth=2;ctx.strokeStyle=surf;ctx.stroke()}
  }else{
    ctx.fillStyle=pc;ctx.globalAlpha=.28;

    ctx.globalAlpha=1;
    ctx.strokeStyle=ac;ctx.lineWidth=2.5;ctx.lineJoin='round';ctx.beginPath();

  }

  {const ty=Math.round(g.Y(TARGET))+.5,tc=cssv('--target');
    ctx.setLineDash([7,5]);ctx.lineWidth=4;ctx.strokeStyle=surf;ctx.globalAlpha=.8;ctx.beginPath();ctx.moveTo(PAD.l,ty);ctx.lineTo(g.W-PAD.r,ty);ctx.stroke();
    ctx.globalAlpha=1;ctx.lineWidth=2;ctx.strokeStyle=tc;ctx.beginPath();ctx.moveTo(PAD.l,ty);ctx.lineTo(g.W-PAD.r,ty);ctx.stroke();ctx.setLineDash([]);
    ctx.font='600 12px '+mono;const txt='Target '+TARGET+' kPa',w=ctx.measureText(txt).width+12;
    ctx.fillStyle=tc;ctx.beginPath();ctx.roundRect(g.W-PAD.r-w,ty-22,w,18,4);ctx.fill();
    ctx.fillStyle=cssv('--bg');ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(txt,g.W-PAD.r-w/2,ty-13);ctx.font='12px '+mono}
  // hover
  const h=M.hover;
  if(h&&M.bar){
    const x=g.X(h.x),y=g.Y(h.y);
    const tip=$('tip');tip.hidden=false;tip.innerHTML=h.tip;
    const tw=tip.offsetWidth,th=tip.offsetHeight;
    tip.style.left=Math.min(Math.max(4,x+14),g.W-tw-4)+'px';
    tip.style.top=Math.min(Math.max(4,y+8),g.H-th-4)+'px';
  }else if(h){

    tip.innerHTML=`<b>${h.y} kPa</b><br>${h.id?h.id+'<br>':''}${fmt(h.x)}`;
    const tw=tip.offsetWidth,th=tip.offsetHeight;
    tip.style.left=Math.min(Math.max(4,x+14),g.W-tw-4)+'px';
    tip.style.top=Math.min(Math.max(4,y-th-12),g.H-th-4)+'px';

function hoverAt(ev){
  if(!M||!M.pts.length||!M.g)return;
  const r=$('c').getBoundingClientRect(),mx=ev.clientX-r.left,my=ev.clientY-r.top,g=M.g;
  if(M.bar){
    let best=null,bd=1e9;for(const b of M.bars){const d=Math.abs(g.X(b.x)-mx);if(d<bd){bd=d;best=b}}
    const half=Math.max(8,g.pw*(M.bw/(g.x1-g.x0))*0.5);
    M.hover=(bd<=half&&my>=PAD.t&&my<=PAD.t+g.ph)?best:null;draw();return;
  }
  let best=null,bd=1e9;
  for(const p of M.pts){
    const dx=g.X(p.x)-mx,dy=g.Y(p.y)-my;
    const d=M.single?Math.abs(dx):Math.hypot(dx,dy);
    if(d<bd){bd=d;best=p}
  }
  const lim=M.single?40:22;
  M.hover=bd<=lim?best:null;draw();
}
$('c').addEventListener('pointermove',hoverAt);

$('c').addEventListener('pointerleave',()=>{if(M){M.hover=null;draw()}});

function setId(v){

}
$('idInput').addEventListener('input',e=>{const v=e.target.value.trim();if(ids.includes(v))setId(v)});

$('all').onclick=()=>setId(null);
const step=d=>{const i=S.id?ids.indexOf(S.id):-1;setId(ids[(i+d+ids.length)%ids.length])};
document.querySelectorAll('#modes button').forEach(b=>b.onclick=()=>{S.mode=b.dataset.m;document.querySelectorAll('#modes button').forEach(x=>x.setAttribute('aria-pressed',x===b));render()});

document.querySelectorAll('#ranges button').forEach(b=>b.onclick=()=>{

  const d=+b.dataset.d;

  $('d1').value=iso(S.from);$('d2').value=iso(MAX);render();
});
function dates(){
  document.querySelectorAll('#ranges button').forEach(x=>x.setAttribute('aria-pressed',false));
  const a=$('d1').valueAsDate,b=$('d2').valueAsDate;
  if(a)S.from=a.getTime()+a.getTimezoneOffset()*60000;

  render();
}
$('d1').onchange=dates;$('d2').onchange=dates;
matchMedia('(prefers-color-scheme: dark)').addEventListener('change',()=>setTimeout(render,50));
new MutationObserver(()=>setTimeout(render,50)).observe(document.documentElement,{attributes:true,attributeFilter:['data-theme']});
render();
